[project]
name = "news-signal-mvp"
version = "0.1.0"
description = "US stock news signal MVP — Episode 3 ships Box 2 (ticker extract) + Box 3 (judge)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/news_signal_mvp"]
